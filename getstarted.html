<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PharmaTrack - Home</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #F9FCFB;
            color: #1F2937;
        }

        header {
            background-color: #006D5B;
            padding: 20px 50px;
        }

        header h1 {
            color: white;
            margin: 0;
        }

        nav {
            margin-top: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 25px;
        }

        .home-content {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 70px 80px;
        }

        .home-text {
            width: 50%;
        }

        .home-text h2 {
            color: #006D5B;
            font-size: 40px;
            margin-bottom: 10px;
        }

        .home-text h3 {
            color: #10B981;
            font-size: 24px;
        }

        .home-text p {
            color: #6B7280;
            font-size: 18px;
            line-height: 1.6;
            max-width: 550px;
        }

        .home-image {
            width: 45%;
            background-color: #E6F7F3;
            border-radius: 20px;
            padding: 20px;
        }

        .home-image img {
            width: 100%;
            display: block;
            border-radius: 15px;
        }

        .get-started {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;

            background-color: #006D5B;
            color: white;

            text-decoration: none;
            border-radius: 8px;
        }

        .get-started:hover {
            background-color: #10B981;
        }

    </style>
</head>

<body>

    <header>

        <h1>PharmaTrack</h1>

    </header>

        <div class="home-content">

            <div class="home-text">

                <h2>PharmaTrack</h2>

                <h3>Pharmacy Management System</h3>

                <p>
                    Manages medicines, categories, prices, available stocks,
                    expiration dates, and customer purchases.
                    It can calculate the total cost of medicines purchased.
                </p>
                
                <a href="dashboard.html" class="get-started">
                    Get Started
                </a>

            </div>


            <div class="home-image">

                <img src="pharmacycounter.png.png" alt="Pharmacy">
            
            </div>

        </div>

    </form>

</body>

</html>

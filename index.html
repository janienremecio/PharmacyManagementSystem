<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PharmaTrack</title>
        <style>
            body{
                background-color: #FFFFFF;
                color: #1F2937;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
            }

            .login-box {
                width: 350px;
                padding: 30px;
                background-color: #E6F7F3;
                border: 1px solid #10B981;
                border-radius: 10px;
                text-align: center;
            }
            input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #E2E8F0;
            }
            button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background-color: #006D5B;
            color: #FFFFFF;
           }
        </style>
    </head>
    <body>
        <div class="login-box">
            <header>
            <p>
                <h1 style="font-size:40px;">PharmaTrack</h1>
            </p>
        </header>
        <form action="getstarted.html">
        <p>
            <input type="email" id="email" placeholder="Email"><br><br>
            <input type="text" id="pw" placeholder="Password"></input><br><br>
            <button type="LOGIN">LOGIN</button>
        </form>   
        </div>
    </body>
</html>
